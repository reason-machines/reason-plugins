name: Test

# Runs the package tests and the ChatGPT directory ZIP build on every pull
# request and on main. The marketplace installation tests need the Codex CLI.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
          npm install --global @openai/codex
          codex --version

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build the ChatGPT directory ZIP
        run: python scripts/build_chatgpt_zip.py reason-chatgpt.zip
