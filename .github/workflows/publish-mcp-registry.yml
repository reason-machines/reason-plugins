name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io. Run it by hand
# (Actions -> Publish to MCP Registry -> Run workflow) for the first listing and
# after each change to server.json; bump "version" there first, because the
# registry refuses to publish the same version twice.
#
# GitHub OIDC proves this repository belongs to the reason-machines
# organization, which is what grants the io.github.reason-machines/* names. No
# secret is stored.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
